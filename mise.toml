[tools]
shfmt = "3.13.0"

[tasks.format]
description = "Format shell sources"
run = """
shfmt -w -ln zsh -i 4 -ci *.zsh tests/*.zsh
shfmt -w -ln bash -i 4 -ci doc/*.sh
"""

[tasks."format:check"]
description = "Check shell formatting"
run = """
shfmt -d -ln zsh -i 4 -ci *.zsh tests/*.zsh
shfmt -d -ln bash -i 4 -ci doc/*.sh
"""
